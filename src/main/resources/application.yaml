spring:
  application:
    name: cloud-drive-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/drive
    username: akbarhusain    
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
       
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080


supabase:
  s3:
    endpoint: ${SUPABASE_ENDPOINT}
    region: ${SUPABASE_REGION}
    access-key: ${SUPABASE_ACCESS_KEY}
    secret-key: ${SUPABASE_SECRET_KEY}
    bucket-name: ${SUPABASE_BUCKET}
 